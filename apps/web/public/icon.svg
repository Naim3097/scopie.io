<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="tile" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#695ACD"/>
      <stop offset="1" stop-color="#9485EB"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="118" fill="url(#tile)"/>
  <!-- Scopie helmet mark: dome + ear cups, visor knockout, smile -->
  <g>
    <!-- ear cups -->
    <rect x="86" y="192" width="44" height="80" rx="22" fill="#ffffff"/>
    <rect x="382" y="192" width="44" height="80" rx="22" fill="#ffffff"/>
    <!-- helmet dome -->
    <path d="M256 146
             C 346 146, 402 172, 402 252
             C 402 306, 386 332, 352 344
             C 324 353, 288 356, 256 356
             C 224 356, 188 353, 160 344
             C 126 332, 110 306, 110 252
             C 110 172, 166 146, 256 146 Z" fill="#ffffff"/>
    <!-- visor window (ground shows through) -->
    <rect x="128" y="163" width="256" height="138" rx="64" fill="url(#tile)"/>
    <!-- smile hugging the visor's lower edge -->
    <path d="M198 262 C 226 292, 286 292, 314 262" stroke="#ffffff" stroke-width="20" stroke-linecap="round" fill="none"/>
  </g>
</svg>
