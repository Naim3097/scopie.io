[project]
name = "scopie-live-agent"
version = "0.2.0"
description = "Scopie Live AI-host A/V transport — LiveKit Agents worker that voices the API's host brain into the room."
requires-python = ">=3.11"
dependencies = [
    "livekit-agents[openai]>=1.0",
    # Avatar renderer plugin — HeyGen LiveAvatar via the LiveKit avatar interface.
    # Swappable for anam / tavus / simli plugins without touching agent logic.
    "livekit-plugins-heygen>=1.0",
    # BM/EN STT for phase 2 voice questions (benchmark against mesolitica):
    # "livekit-plugins-deepgram",
    "httpx>=0.27",
]

[tool.uv]
dev-dependencies = ["ruff>=0.6"]
